name: CI-CD

on:
  pull_request:
    types: [closed]

jobs:
  continuous-integration:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 487620625686.dkr.ecr.eu-north-1.amazonaws.com

      - name: Build and push frontend image
        run: |
          docker build -t sentiment-frontend:${{ github.run_number }} .
          docker tag sentiment-frontend:${{ github.run_number }} 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-frontend:${{ github.run_number }}
          docker push 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-frontend:${{ github.run_number }}

  continuous-cluster-deployment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: continuous-integration

    steps:
      - name: Clone GitOps frontend config repository
        run: |
          git clone https://${{ secrets.GITOPS_USERNAME }}:${{ secrets.GITOPS_TOKEN }}@github.com/Daczy-Alpha/sent-fron-config.git

      - name: Update frontend deployment image tag
        run: |
          cd sent-fron-config

          sed -i "s|image: 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-frontend:.*|image: 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-frontend:${{ github.run_number }}|g" deployment.yaml

          cat deployment.yaml

      - name: Commit and push GitOps update
        run: |
          cd sent-fron-config

          git config user.name "${{ secrets.GITOPS_USERNAME }}"
          git config user.email "${{ secrets.GITOPS_EMAIL }}"

          git add deployment.yaml
          git commit -m "Update frontend image to ${{ github.run_number }}"
          git push origin main
